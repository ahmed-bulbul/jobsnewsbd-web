<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00805D"/>
      <stop offset="1" stop-color="#004330"/>
    </linearGradient>
    <radialGradient id="blip" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#F7BC57"/>
      <stop offset="1" stop-color="#D4891A"/>
    </radialGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- radar sweep wedge -->
    <path d="M 256 256 L 256 60 A 196 196 0 0 1 396 116 Z" fill="#F4A825" opacity="0.28"/>

    <!-- concentric radar rings -->
    <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5"/>
    <circle cx="256" cy="256" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="5"/>

    <!-- crosshair ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round">
      <line x1="256" y1="40"  x2="256" y2="70"/>
      <line x1="256" y1="442" x2="256" y2="472"/>
      <line x1="40"  y1="256" x2="70"  y2="256"/>
      <line x1="442" y1="256" x2="472" y2="256"/>
    </g>

    <!-- outer pulse ring around blip -->
    <circle cx="256" cy="256" r="66" fill="none" stroke="#F4A825" stroke-opacity="0.45" stroke-width="4"/>

    <!-- center blip (job found) -->
    <circle cx="256" cy="256" r="46" fill="url(#blip)"/>
    <circle cx="256" cy="256" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4"/>

    <!-- checkmark -->
    <path d="M 236 258 L 250 272 L 280 240" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
